services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memesploding
      POSTGRES_USER: memesploding
      POSTGRES_PASSWORD: memesploding
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  game:
    build:
      context: .
      dockerfile: server/Memesploding.Game/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5204
      ConnectionStrings__RedisConnection: redis:6379,abortConnect=false
      Jwt__Key: ${JWT_KEY:-dev-jwt-key-change-me-please-0123456789abcdef}
      Jwt__Issuer: MemesplodingApi
      Jwt__Audience: MemesplodingClient
      GameTicket__Issuer: MemesplodingApi
      GameTicket__Audience: MemesplodingGameServer
    ports:
      - "5204:5204"
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: server/Memesploding.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5217
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=memesploding;Username=memesploding;Password=memesploding;Include Error Detail=true
      ConnectionStrings__RedisConnection: redis:6379,abortConnect=false
      Jwt__Key: ${JWT_KEY:-dev-jwt-key-change-me-please-0123456789abcdef}
      Jwt__Issuer: MemesplodingApi
      Jwt__Audience: MemesplodingClient
      GameTicket__Issuer: MemesplodingApi
      GameTicket__Audience: MemesplodingGameServer
      Realtime__GameWsUrl: ws://localhost:5204/ws
    ports:
      - "5217:5217"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      game:
        condition: service_started
    restart: on-failure

  # http-tests:
  #   profiles: ["test"]
  #   build:
  #     context: .
  #     dockerfile: server/Memesploding.Api/HttpTests/Dockerfile
  #   environment:
  #     BASE_URL: http://api:5217/api/v1
  #     API_HEALTH_URL: http://api:5217/openapi/v1.json
  #   depends_on:
  #     api:
  #       condition: service_started

volumes:
  pgdata:
  redisdata:
