name: Backend CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore server/Memesploding.sln

      - name: Build solution
        run: dotnet build server/Memesploding.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test server/Memesploding.sln --configuration Release --no-build

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build API Server image
        run: >
          docker build
          --file server/Memesploding.Api/Dockerfile
          --tag memesploding-api:ci
          .

      - name: Build Game Server image
        run: >
          docker build
          --file server/Memesploding.Game/Dockerfile
          --tag memesploding-game:ci
          .
